<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumin</title>

    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Slab:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <nav class="nav" aria-label="Customization">
      <button
        class="menu-toggle"
        id="menu-toggle"
        type="button"
        aria-label="Open settings"
        aria-expanded="false"
        aria-controls="settings-menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="settings-menu" id="settings-menu" hidden>
        <h2>Customize ✦</h2>

        <!-- Particle Count -->
        <label for="particle-count">
          Particles
          <output id="particle-count-value">140</output>
        </label>
        <input type="range" id="particle-count" min="0" max="400" value="140" />

        <!-- Particle Size -->
        <label for="particle-size">
          Particle Size
          <output id="particle-size-value">5</output>
        </label>
        <input
          type="range"
          id="particle-size"
          min="1"
          max="12"
          step="0.5"
          value="5"
        />

        <!-- Particle Speed -->
        <label for="particle-speed">
          Speed
          <output id="particle-speed-value">1</output>
        </label>
        <input
          type="range"
          id="particle-speed"
          min="0"
          max="3"
          step="0.1"
          value="1"
        />

        
        <!-- Repulsion Force -->
        <label for="particle-force">
          Repulsion Force
          <output id="particle-force-value">10</output>
        </label>
        
        <input
          type="range"
          id="particle-force"
          min="0"
          max="30"
          step="1"
          value="10"
        />


        <!-- Connections -->
        <div class="connection-settings">
          <label for="particle-connections">
            Connections
            <input
              type="checkbox"
              id="particle-connections"
              role="switch"
              aria-label="Show particle connections"
            />
          </label>
        </div>

        <!-- Background Themes -->
        <div class="background-settings">
          <p class="settings-label">Background</p>

          <div class="background-options">
            <!-- MOODY -->
            <button
              class="background-option active"
              type="button"
              data-theme="deep-ocean"
              aria-label="Deep Ocean"
              aria-pressed="true"
              title="Deep Ocean"
              style="--color-1: #80adbf; --color-2: #0f1b26"
            ></button>

            <button
              class="background-option"
              type="button"
              data-theme="black-cherry"
              aria-label="Black Cherry"
              aria-pressed="false"
              title="Black Cherry"
              style="--color-1: #a56c88; --color-2: #220f22"
            ></button>

            <!-- PASTELL -->
            <button
              class="background-option"
              type="button"
              data-theme="cotton-candy"
              aria-label="Cotton Candy"
              aria-pressed="false"
              title="Cotton Candy"
              style="--color-1: #eeaeca; --color-2: #94bbe9"
            ></button>

            <button
              class="background-option"
              type="button"
              data-theme="lavender"
              aria-label="Lavender"
              aria-pressed="false"
              title="Lavender"
              style="--color-1: #c7b6e5; --color-2: #9dcacb"
            ></button>

            <!-- FUN -->
            <button
              class="background-option"
              type="button"
              data-theme="cyber-cyan"
              aria-label="Cyber Cyan"
              aria-pressed="false"
              title="Cyber Cyan"
              style="--color-1: #00e5ff; --color-2: #241044"
            ></button>

            <button
              class="background-option"
              type="button"
              data-theme="cyber-lime"
              aria-label="Cyber Lime"
              aria-pressed="false"
              title="Cyber Lime"
              style="--color-1: #b6dc65; --color-2: #244d54"
            ></button>
          </div>
        </div>
      </div>
    </nav>

    <canvas id="canvas1" aria-hidden="true"></canvas>

    <script src="script.js"></script>
  </body>
</html>
